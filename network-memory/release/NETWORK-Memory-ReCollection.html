tat:`tec`,value:.2,turns:2}]},{id:`ES-0012`,name:`破損散布`,kind:`active`,attribute:`ERROR`,target:`enemy_single`,cooldown:1,description:`TEC90%のERROR属性ダメージを与え、50%の確率で3ターン『侵食』を付与する。`,effects:[{type:`damage`,scale:`tec`,power:.9},{type:`status`,status:`corrupt`,chance:.5,turns:3}]},{id:`ES-0013`,name:`群狼の牙`,kind:`active`,attribute:`ERROR`,target:`enemy_single`,cooldown:1,description:`ATK150%のERROR属性ダメージ。`,effects:[{type:`damage`,scale:`atk`,power:1.5}]},{id:`ES-0014`,name:`アルファハウル`,kind:`active`,attribute:`ERROR`,target:`self`,cooldown:3,description:`3ターンの間ATKを25%上昇させる。`,effects:[{type:`buff`,stat:`atk`,value:.25,turns:3}]},{id:`ES-0015`,name:`全域侵食`,kind:`active`,attribute:`ERROR`,target:`enemy_single`,cooldown:3,description:`TEC120%のERROR属性ダメージを与え、3ターン『侵食』を付与する。`,effects:[{type:`damage`,scale:`tec`,power:1.2},{type:`status`,status:`corrupt`,chance:1,turns:3}]}],Ce=JSON.parse(`[{"id":"REC-0001","memoryId":"MEM-0001","fragments":[{"id":"REC-0001-1","title":"灯す者","unlock":{"type":"owned"},"text":"ルクスはNULL CITYに残る最後の点灯夫だ。記録の途絶えた街灯はやがて消え、消えた街灯の下の通りは、地図からも人の記憶からも消えていく。だから彼は今夜も灯竿を担ぎ、一本ずつ火を入れて回る。"},{"id":"REC-0001-2","title":"灯さない交差点","unlock":{"type":"relatedOwned","memoryId":"MEM-0004"},"text":"第七区画の交差点にだけ、ルクスは決して灯りを点さない。「あそこでは、まだ誰かが待ってる。明るくしたら、向こうから見つけてもらえなくなるだろう」"},{"id":"REC-0001-3","title":"最後の点灯夫","unlock":{"type":"level","value":20},"text":"ルクスがNULL CITYに来る前に何をしていたのかは、どこにも記録されていない。ただ一度だけ、彼はこう呟いたことがある。「昔、もっと大きな灯りを消したことがあるんだ」"}]},{"id":"REC-0002","memoryId":"MEM-0002","fragments":[{"id":"REC-0002-1","title":"小さな泥棒","unlock":{"type":"owned"},"text":"ビットキャットがくわえて運ぶのは、決まって誰かに忘れられかけた記録の欠片だ。盗んでいるのではなく、拾い集めているのだと気づいた探索者は、まだ少ない。"},{"id":"REC-0002-2","title":"天敵","unlock":{"type":"relatedOwned","memoryId":"MEM-0008"},"text":"グリッチハウンドの遠吠えが聞こえると、ビットキャットはすぐに姿を消す。だが群れが去った後の路地では、散らばっていた破損データがいつもきれいに片付けられている。"},{"id":"REC-0002-3","title":"九番目の保存領域","unlock":{"type":"level","value":20},"text":"ビットキャットには九つの保存領域がある。そのうち八つは空だ。最後のひとつにだけ、誰かの膝の上で眠ったときの温度が、大切にしまわれている。"}]},{"id":"REC-0003","memoryId":"MEM-0003","fragments":[{"id":"REC-0003-1","title":"合鍵","unlock":{"type":"owned"},"text":"ARCHIVEの封印書架は、司書でさえ開けることを許されていない。この合鍵は、その『許されない』を開くために、誰かが密かに作ったものだ。"},{"id":"REC-0003-2","title":"第三書架","unlock":{"type":"relatedOwned","memoryId":"MEM-0007"},"text":"合鍵の歯の形は、第三司書リブラが管理していた書架の鍵穴と一致する。大流出の日、ただひとつ空になったあの書架と。"},{"id":"REC-0003-3","title":"錆の理由","unlock":{"type":"limitBreak","value":1},"text":"錆は時間ではなく、使われなかったことで生まれる。この鍵は、作られてから一度も回されていない——少なくとも、記録の上では。"}]},{"id":"REC-0004","memoryId":"MEM-0004","fragments":[{"id":"REC-0004-1","title":"赤信号","unlock":{"type":"owned"},"text":"第七区画の交差点の信号は、大流出の日から赤のまま変わらない。誰かが渡るのを待っているのか、誰かが渡ってくるのを待っているのか。"},{"id":"REC-0004-2","title":"白い傘","unlock":{"type":"relatedOwned","memoryId":"MEM-0001"},"reveals":["MEM-0012"],"text":"ルクスの記録にだけ、交差点の向こう側に立つ人影が残っていた。白い服、白い傘。顔があるべき場所には、何も記録されていない。"},{"id":"REC-0004-3","title":"雨の正体","unlock":{"type":"level","value":30},"text":"雨粒をひとつ解析すると、それは『待っている』という一文だけの記録だった。降り続く無数の雨粒すべてが、同じ一文でできている。"}]},{"id":"REC-0005","memoryId":"MEM-0005","fragments":[{"id":"REC-0005-1","title":"花の番人","unlock":{"type":"owned"},"text":"LOST GARDENに咲く花は、すべて誰かに忘れられた記録だ。庭守は花を摘もうとする者を追い払う。忘れられたものにも、咲いている権利があると信じているから。"},{"id":"REC-0005-2","title":"静かなもの","unlock":{"type":"level","value":10},"reveals":["MEM-0010"],"text":"近ごろ、庭の奥で花が色を失って散っていく。庭守はそれを『静かなもの』と呼んで怯えている。すべての記録の終着点——忘却が、庭の最深部で目を覚ましたのだ。"},{"id":"REC-0005-3","title":"わすれないで","unlock":{"type":"relatedOwned","memoryId":"MEM-0010"},"text":"庭守が繰り返す『わすれないで』は、花たちに向けた言葉ではない。それは庭守自身が、最後に誰かから言われた言葉の記録だった。"}]},{"id":"REC-0006","memoryId":"MEM-0006","fragments":[{"id":"REC-0006-1","title":"接続ログ","unlock":{"type":"owned"},"text":"> CONNECTION ESTABLISHED. WELCOME, EXPLORER.\\nあなたの接続記録はそこから始まっている。だが、そのタイムスタンプは、大流出が起きた時刻よりも前を指している。"},{"id":"REC-0006-2","title":"欠損箇所","unlock":{"type":"relatedOwned","memoryId":"MEM-0007"},"text":"リブラによれば、接続記録の欠損は『破損』ではなく『削除』だという。誰かが意図的に、あなたの最初の数秒間を消したのだ。"},{"id":"REC-0006-3","title":"消された数秒間","unlock":{"type":"flag","flag":"story.prologue.clear","label":"STORY「PROLOGUE アカルア」を読了"},"text":"消された数秒間の復元に、わずかに成功した。そこには、誰かの声が一言だけ残っていた。『——今度は、忘れないで』"}]},{"id":"REC-0007","memoryId":"MEM-0007","fragments":[{"id":"REC-0007-1","title":"第三司書","unlock":{"type":"owned"},"text":"リブラはARCHIVEに勤める七人の司書のうち、三番目に古い。彼女は一度読んだ記録を決して忘れない。だからこそ、自分の担当書架が空になった理由を思い出せないことが、彼女には耐えられない。"},{"id":"REC-0007-2","title":"空の書架","unlock":{"type":"relatedOwned","memoryId":"MEM-0003"},"reveals":["MEM-0011"],"text":"合鍵を見せると、リブラは長い沈黙の後に言った。「あの日、書架から流れ出したのは記録だけではありません。『流出』という出来事そのものが、ひとつのMemoryとして記録されたはずなのです」"},{"id":"REC-0007-3","title":"読む側の嘘","unlock":{"type":"level","value":30},"text":"『記録は嘘をつきません』——リブラの口癖には続きがある。誰にも話したことはないが、自分の記録の最後の行にだけ、彼女はこう書き残している。『だから私は、読むのをやめました』"}]},{"id":"REC-0008","memoryId":"MEM-0008","fragments":[{"id":"REC-0008-1","title":"猟犬","unlock":{"type":"owned"},"text":"ERROR ZONEをうろつく猟犬の群れは、破損したデータを見つけると一斉に喰らいつく。探索者にとっては脅威だが、群れが通った後のエリアは、不思議と安定している。"},{"id":"REC-0008-2","title":"清掃プログラム","unlock":{"type":"relatedOwned","memoryId":"MEM-0002"},"text":"ハウンドのコードの奥には、古い命令文が残っている。『破損を除去せよ。Networkを清潔に保て』。命令の発行者の欄は、ノイズで読めない。"},{"id":"REC-0008-3","title":"遠吠えの意味","unlock":{"type":"level","value":30},"text":"解析すると、ハウンドの遠吠えはひとつの問いの繰り返しだった。『ERROR ZONEそのものが破損であるなら、我々はどこまで喰らえばいい？』"}]},{"id":"REC-0009","memoryId":"MEM-0009","fragments":[{"id":"REC-0009-1","title":"誰でもない顔","unlock":{"type":"owned"},"text":"仮面を被った者は、他人の目に『なりたかった誰か』として映るようになる。代わりに、自分自身の記録が少しずつノイズで上書きされていく。"},{"id":"REC-0009-2","title":"最初の持ち主","unlock":{"type":"relatedOwned","memoryId":"MEM-0008"},"text":"仮面の内側に、かすかな署名が残っている。ERROR ZONEがまだ別の名前で呼ばれていた頃の、ある研究者の名前だ。その名前は、どの記録にも二度と登場しない。"},{"id":"REC-0009-3","title":"白い顔","unlock":{"type":"relatedOwned","memoryId":"MEM-0012"},"text":"仮面のノイズを丁寧に取り除いていくと、最後に現れたのは誰の顔でもない、真っ白な顔だった。"}]},{"id":"REC-0010","memoryId":"MEM-0010","fragments":[{"id":"REC-0010-1","title":"終着点","unlock":{"type":"owned"},"text":"忘却は敵意を持たない。ただ、あらゆる記録が最後に辿り着く場所として、そこに在るだけだ。触れられた記録は色を失い、静かに白紙へと還っていく。"},{"id":"REC-0010-2","title":"庭の奥で","unlock":{"type":"relatedOwned","memoryId":"MEM-0005"},"text":"忘却は、LOST GARDENの最深部で長いあいだ眠っていた。それを揺り起こしたのは、大流出の日に庭へ流れ込んだ、膨大な量の『忘れられた記録』だった。"},{"id":"REC-0010-3","title":"忘却が忘れたもの","unlock":{"type":"level","value":40},"text":"すべてを忘れさせる忘却にも、ひとつだけ忘れられない記録がある。白い傘を差した少女が、忘却の手を握って言った言葉だ。『あなたも、誰かに覚えていてほしかったんだね』"}]},{"id":"REC-0011","memoryId":"MEM-0011","fragments":[{"id":"REC-0011-1","title":"その日","unlock":{"type":"owned"},"text":"その日、Networkの各地で記録が一斉にカード状に固まり、世界の外へと流れ出した。流出したMemoryの総数は、現在も集計が終わっていない。"},{"id":"REC-0011-2","title":"原因不明","unlock":{"type":"relatedOwned","memoryId":"MEM-0006"},"text":"大流出の記録には、発生時刻も、被害範囲も、流出経路も記されている。欠けているのは原因と、最初に流出したMemoryの名前だけだ。"},{"id":"REC-0011-3","title":"最初の流出","unlock":{"type":"flag","flag":"story.chapter1.clear","label":"STORY「CHAPTER 1 灯りの消えた街」を読了"},"text":"最初に流出したMemoryは、名前の欄が空白のまま記録されていた。カテゴリは UNKNOWN。レアリティは——IRREGULAR。"}]},{"id":"REC-0012","memoryId":"MEM-0012","fragments":[{"id":"REC-0012-1","title":"白紙","unlock":{"type":"owned"},"text":"彼女には名前も、出身も、記録もない。それでも、あなたが彼女の手を取った瞬間、カードには一行だけ文字が浮かんだ。『Re:Collection』"},{"id":"REC-0012-2","title":"待ち合わせ","unlock":{"type":"relatedOwned","memoryId":"MEM-0004"},"text":"「赤信号が変わったら、渡ってきてくれるって約束したの」少女はそう言って、雨の交差点のほうを見た。「でも、誰と約束したのかは、覚えてないんだ」"},{"id":"REC-0012-3","title":"■■■■","unlock":{"type":"flag","flag":"story.finale.clear","label":"????"},"text":"——あなたは、わたしを覚えてる？"}]},{"id":"REC-0013","memoryId":"MEM-0013","fragments":[{"id":"REC-0013-1","title":"巡回ログ","unlock":{"type":"owned"},"text":"ドローンの記録媒体には、四十万件を超える巡回ログが残っている。最初の数万件には街の喧騒が記録されているが、ある日を境に、すべてが『異常なし』の一行だけになる。"},{"id":"REC-0013-2","title":"点灯夫の記録","unlock":{"type":"relatedOwned","memoryId":"MEM-0001"},"text":"ドローンのログには、毎晩同じ人物が記録されている。灯竿を担いだ男。ドローンは彼を一度も『不審者』と判定していない。判定欄には、ただ『同僚』とある。"},{"id":"REC-0013-3","title":"宛先不明","unlock":{"type":"level","value":20},"text":"ドローンが送信し続けている宛先を解析すると、それは管制センターではなかった。宛先の欄に記録されていたのは、NULL CITYがまだ別の名前だった頃の、ひとつの住所だった。"}]},{"id":"REC-0014","memoryId":"MEM-0014","fragments":[{"id":"REC-0014-1","title":"廃棄指定","unlock":{"type":"owned"},"text":"この辞書は読むたびに違う意味を返す。司書たちは廃棄を決めたが、焼却炉に入れようとした司書は、なぜか毎回『焼却』という言葉の意味を思い出せなくなった。"},{"id":"REC-0014-2","title":"第三司書の書き込み","unlock":{"type":"relatedOwned","memoryId":"MEM-0007"},"text":"余白に、几帳面な筆跡の書き込みがある。『この誤植は、誤植ではない。誰かが意図して書き換えた跡がある』。署名は、リブラ。"},{"id":"REC-0014-3","title":"正しい項目","unlock":{"type":"level","value":20},"text":"ただひとつだけ、一度も書き換わらない項目がある。【白紙】はく-し：何も書かれていない紙。これから、何でも書ける紙。"}]},{"id":"REC-0015","memoryId":"MEM-0015","fragments":[{"id":"REC-0015-1","title":"北の花壇","unlock":{"type":"owned"},"text":"この向日葵は、陽の当たらない北の花壇に咲いている。それでも毎朝、ないはずの太陽の方角へ花を向ける。庭守たちは、それを『祈り』と呼んでいる。"},{"id":"REC-0015-2","title":"庭守の手入れ","unlock":{"type":"relatedOwned","memoryId":"MEM-0005"},"text":"向日葵の根元だけ、土がいつも柔らかい。勿忘草の庭守が、毎晩こっそり世話をしているのだ。誰にも見られていないと思っているらしい。"},{"id":"REC-0015-3","title":"向日葵が見ているもの","unlock":{"type":"level","value":20},"text":"向日葵が顔を向けている方角を正確に辿ると、それは空ではなく、庭の最深部——忘却が眠っていた場所を指していた。"}]},{"id":"REC-0016","memoryId":"MEM-0016","fragments":[{"id":"REC-0016-1","title":"王なき王冠","unlock":{"type":"owned"},"text":"王冠の内側には、王の名前が刻まれていたはずの溝がある。今はノイズで埋まっていて、どんな解析にも応じない。"},{"id":"REC-0016-2","title":"最後の命令","unlock":{"type":"relatedOwned","memoryId":"MEM-0008"},"text":"猟犬たちが従っている命令は、ひとつだけだった。『破損を除去せよ』。王冠は、自分自身もまた破損であることに、まだ気づいていない。"},{"id":"REC-0016-3","title":"戴冠","unlock":{"type":"level","value":30},"text":"記録の最も古い層に、戴冠式の断片が残っていた。王冠を受け取ったのは、顔のない、白い服の誰かだった。"}]}]`),we=[{id:`WORLD-001`,name:`NULL CITY`,subtitle:`値を失った街`,description:`記録の途絶えた区画から順に灯りが消えていく、夜と雨の都市。大流出の影響を最初に受けた世界のひとつ。`,attribute:`DATA`,unlock:{type:`initial`},restorations:[{id:`R001-LUX`,memoryId:`MEM-0001`,name:`点灯夫ルクスの帰還`,description:`夜の街路に灯竿を担いだ男が戻り、消えていた街灯がひとつずつ灯り始めた。`,lostDescription:`灯りの消えた通りに、誰かの足音だけが残っている。`},{id:`R001-CAT`,memoryId:`MEM-0002`,name:`路地裏の猫たち`,description:`0と1でできた猫たちが路地裏に戻り、散らばった記録の欠片を拾い集めている。`,lostDescription:`路地裏は静まり返り、記録の欠片が雨に流されている。`},{id:`R001-CROSS`,memoryId:`MEM-0004`,name:`第七区画・雨の交差点`,description:`地図から消えていた第七区画が復元され、交差点へ続く道が通れるようになった。`,lostDescription:`地図の一角が、雨の向こうに滲んで読めない。`},{id:`R001-PATROL`,memo ay","char":"CHR-MOMIJI","expr":"smile","text":"やった！　よろしくね、{player}さん！"},{"t":"say","char":"CHR-HITORI","expr":"normal","text":"……足、引っ張るなよ。"},{"t":"say","char":"CHR-MOMIJI","expr":"pout","text":"もう、独くんってば素直じゃないんだから。"},{"t":"say","char":"CHR-HITORI","expr":"annoyed","text":"……うるさい。"},{"t":"say","char":"CHR-HARUKA","expr":"smile","text":"ふふ。それじゃあ、最初のお仕事。第七区画の流出反応の調査をお願いできるかしら。独くんの観測だと、弱い反応が二つ。……無理はしないでね。"},{"t":"set","flag":"story.prologue.clear","value":true},{"t":"fx","type":"fade-out","ms":900},{"t":"title","text":"何でも屋「アカルア」","sub":"BATTLE で流出反応に接続し、Memory を回収しよう"},{"t":"end"}]},{"id":"CH-001","order":1,"label":"CHAPTER 1","title":"灯りの消えた街","summary":"消灯の影を鎮めた夜、アカルアの端末に、桁違いの流出反応が映る。","unlock":[{"type":"storyCleared","chapterId":"CH-000"},{"type":"encounterCleared","encounterId":"ENC-002"}],"rewards":{"currencies":{"FRAGMENT":50,"CORE":3}},"script":[{"t":"bgm","id":"rain"},{"t":"bg","id":"null-city-rain","fx":"cut"},{"t":"title","text":"CHAPTER 1","sub":"灯りの消えた街"},{"t":"narr","text":"消灯の影が崩れると、通りの街灯がひとつ、またひとつと灯り始めた。"},{"t":"show","char":"CHR-HITORI","pos":"left","expr":"normal"},{"t":"say","char":"CHR-HITORI","expr":"smirk","text":"……反応、消えた。やったな。"},{"t":"show","char":"CHR-MOMIJI","pos":"right","expr":"worried"},{"t":"say","char":"CHR-MOMIJI","expr":"worried","text":"{player}さん、大丈夫？　怪我してない？　ちょっと見せて。"},{"t":"narr","text":"紅葉は手際よく傷を確かめていく。その指で、独と揃いの指輪が小さく光った。"},{"t":"if","cond":[{"type":"ownedMemory","memoryId":"MEM-0001"}],"goto":"lux-talk","else":"back-home"},{"t":"label","id":"lux-talk"},{"t":"say","char":"CHR-HITORI","expr":"normal","text":"灯りが戻ったのは、点灯夫の記録のおかげか。……あんたが同期してる、あの Memory の。"},{"t":"say","char":"CHR-MOMIJI","expr":"smile","text":"なんだか、街が「おかえり」って言ってるみたいだね。"},{"t":"label","id":"back-home"},{"t":"fx","type":"fade-out","ms":700},{"t":"hide","char":"CHR-HITORI"},{"t":"hide","char":"CHR-MOMIJI"},{"t":"bg","id":"akarua-office","fx":"cut"},{"t":"bgm","id":"akarua"},{"t":"fx","type":"fade-in","ms":800},{"t":"show","char":"CHR-HARUKA","pos":"center","expr":"smile"},{"t":"say","char":"CHR-HARUKA","expr":"smile","text":"おかえりなさい。二人から聞いたわ。第七区画の灯り、戻ったのね。"},{"t":"say","char":"CHR-HARUKA","expr":"normal","text":"Memoryを回収すると、その記録が世界へ帰っていくの。人が戻って、建物が戻って、忘れられていた出来事が思い出される。……世界が、修復されていくのよ。"},{"t":"show","char":"CHR-MOMIJI","pos":"right","expr":"smile"},{"t":"say","char":"CHR-MOMIJI","expr":"smile","text":"じゃあ、もっとたくさん回収したら、NULL CITYもまた明るくなるんだね！"},{"t":"show","char":"CHR-HITORI","pos":"left","expr":"serious"},{"t":"say","char":"CHR-HITORI","expr":"serious","text":"……それより、ハルカさん。さっきから別の反応が出てる。でかい。今までのとは桁が違う。"},{"t":"bgm","id":"tension"},{"t":"se","id":"glitch"},{"t":"fx","type":"glitch","ms":900},{"t":"narr","text":"店の端末に、ノイズ混じりの記録が浮かび上がる。"},{"t":"narr","text":"> RECORD: 大流出 / 原因 = NOT FOUND"},{"t":"say","char":"CHR-HARUKA","expr":"serious","text":"……これは、「流出」そのものの記録ね。あの日、何が起きたのか。その出来事自体が Memory になって、どこかを漂っている。"},{"t":"if","cond":[{"type":"discoveredMemory","memoryId":"MEM-0012"}],"goto":"umbrella","else":"need-sync"},{"t":"label","id":"umbrella"},{"t":"say","char":"CHR-MOMIJI","expr":"worried","text":"ねえ、記録の端っこ……白い傘の女の子が映ってない？　交差点の記録で見たのと、同じ……"},{"t":"say","char":"CHR-HITORI","expr":"surprised","text":"……見間違いじゃない。顔のところだけ、何も記録されてない。"},{"t":"say","char":"CHR-HARUKA","expr":"worried","text":"記録されていない誰か……。覚えておきましょう。きっと、また会うことになるわ。"},{"t":"label","id":"need-sync"},{"t":"say","char":"CHR-HITORI","expr":"serious","text":"流出の原因が分かれば、全部まとめて取り戻せるかもしれない。……{player}、あんたの同期の力が要る。"},{"t":"choice","id":"resolve","options":[{"value":"go","text":"やってみる","goto":"resolve-go"},{"value":"afraid","text":"……少し、怖い","goto":"resolve-afraid"}]},{"t":"label","id":"resolve-go"},{"t":"say","char":"CHR-HARUKA","expr":"smile","text":"ありがとう。でもね、ひとりで背負わなくていいのよ。ここには、みんながいるんだから。"},{"t":"goto","label":"detect"},{"t":"label","id":"resolve-afraid"},{"t":"say","char":"CHR-HARUKA","expr":"normal","text":"怖くていいの。怖いって思えるのは、ちゃんと自分を大事にできている証拠だもの。"},{"t":"say","char":"CHR-MOMIJI","expr":"smile","text":"大丈夫！　痛いのは、私が半分引き受けてあげる。"},{"t":"say","char":"CHR-HITORI","expr":"annoyed","text":"紅葉、それは冗談になってない。"},{"t":"label","id":"detect"},{"t":"say","char":"CHR-HITORI","expr":"smirk","text":"反応を捕まえた。今なら接触できる。……僕はまだ、こんなところで終わったつもりはないからな。"},{"t":"se","id":"sync"},{"t":"detect","memoryId":"MEM-0011"},{"t":"narr","text":"端末の上で、ひとつの Memory が静かに脈打っている。——同期の準備ができた。"},{"t":"set","flag":"story.chapter1.clear","value":true},{"t":"fx","type":"fade-out","ms":900},{"t":"title","text":"Memory 検出：大流出","sub":"MEMORY › PENDING SYNC から接触できる（同期条件あり）"},{"t":"end"}]},{"id":"INT-001","order":1.5,"label":"INTERLUDE","title":"目印","summary":"眠れない夜。帰らない独を待つ紅葉が、二人の「ここに来る前」の話を始める。","contentNote":"この章には、自死・いじめに関する話題が含まれます（直接的な描写はありません）。","unlock":[{"type":"storyCleared","chapterId":"CH-001"}],"rewards":{"currencies":{"FRAGMENT":30,"DATA":200}},"script":[{"t":"bgm","id":"night"},{"t":"bg","id":"akarua-night","fx":"cut"},{"t":"title","text":"INTERLUDE","sub":"目印"},{"t":"narr","text":"その夜は、なかなか眠れなかった。階下の店に降りると、明かりを落としたカウンターに、紅葉がひとりで座っていた。"},{"t":"show","char":"CHR-MOMIJI","pos":"center","expr":"worried"},{"t":"say","char":"CHR-MOMIJI","expr":"surprised","text":"あ……{player}さん。ごめんね、起こしちゃった？"},{"t":"say","char":"CHR-MOMIJI","expr":"worried","text":"独くん、まだ帰ってこないの。「ひとりで行ける」って、また勝手に夜の仕事に出ちゃって。"},{"t":"choice","id":"wait","options":[{"value":"stay","text":"一緒に待つよ","goto":"wait-stay"},{"value":"search","text":"探しに行こうか？","goto":"wait-search"}]},{"t":"label","id":"wait-stay"},{"t":"say","char":"CHR-MOMIJI","expr":"smile","text":"……ありがと。じゃあ、ちょっとだけ付き合って。"},{"t":"goto","label":"waiting"},{"t":"label","id":"wait-search"},{"t":"say","char":"CHR-MOMIJI","expr":"worried","text":"ううん、大丈夫。ちゃんと帰ってくるって、約束してくれたから。……約束、したもん。"},{"t":"label","id":"waiting"},{"t":"narr","text":"壁の時計の音だけが、店の中に響いている。"},{"t":"say","char":"CHR-MOMIJI","expr":"sad","text":"ねえ、{player}さん。独くんがいつも「ひとりでいい」って言うの、どうしてだと思う？"},{"t":"narr","text":"答える前に、紅葉は指輪を見つめたまま、小さな声で話し始めた。"},{"t":"say","char":"CHR-MOMIJI","expr":"normal","text":"私と独くんはね、ここに来る前、現世の……日本の、同じ学校にいたの。私は独くんの後輩で、孤月紅葉っていう名前だった。"},{"t":"say","char":"CHR-MOMIJI","expr":"smile","text":"私が一方的に好きだっただけ。独くん、ぜんぜん気づいてなかったけどね。"},{"t":"say","char":"CHR-MOMIJI","expr":"sad","text":"あるとき、独くんのお父さんとお母さんが、事故でいなくなっちゃって。……そこから独くん、少しずつ壊れていったの。"},{"t":"say","char":"CHR-MOMIJI","expr":"sad","text":"クラスの人たちにひどいことをされても、誰にも言わなかった。……私にも。"},{"t":"fx","type":"noise","ms":700},{"t":"say","char":"CHR-MOMIJI","expr":"sad","text":"それでね。独くんは一回、私の前からいなくなったの。……自分で、全部終わらせて。"},{"t":"narr","text":"紅葉の声は静かだった。けれど、指輪を握る手は、白くなるほど強張っていた。"},{"t":"say","char":"CHR-MOMIJI","expr":"sad","text":"私を巻き込まないためだったんだって。自分がいなくなれば、私も、自分も、楽になれるって。……そんなわけ、ないのにね。"},{"t":"se","id":"door"},{"t":"fx","type":"glitch","ms":500},{"t":"se","id":"glitch"},{"t":"show","char":"CHR-HITORI","pos":"left","expr":"serious"},{"t":"say","char":"CHR-HITORI","expr":"serious","text":"……その話、あんまり人にするなって言ったろ。"},{"t":"narr","text":"扉の前に、独が立っていた。肩のあたりの輪郭が、ノイズのように揺らいでいる。"},{"t":"show","char":"CHR-MOMIJI","pos":"right","expr":"surprised"},{"t":"say","char":"CHR-MOMIJI","expr":"surprised","text":"独くん！　……また {Glitch} 使ったでしょ。身体、ちゃんと見せて！"},{"t":"say","char":"CHR-HITORI","expr":"annoyed","text":"平気だ。……少し、削れただけ。"},{"t":"say","char":"CHR-MOMIJI","expr":"pout","text":"「だけ」じゃないの！"},{"t":"narr","text":"紅葉が独の手を取ると、揺らいでいた輪郭が、少しずつ落ち着いていく。"},{"t":"say","char":"CHR-HITORI","expr":"normal","text":"……{player}。紅葉の言ったことは、本当だ。"},{"t":"say","char":"CHR-HITORI","expr":"sad","text":"あの時、僕は誰にも「助けて」って言わなかった。それが、いちばん誰も傷つけないやり方だと思ってた。"},{"t":"say","char":"CHR-HITORI","expr":"sad","text":"違った。いちばん傷ついたのは、目の前にいたこいつだった。"},{"t":"choice","id":"answer","options":[{"value":"thanks","text":"……話してくれて、ありがとう","goto":"answer-thanks"},{"value":"now","text":"今は、どう？","goto":"answer-now"}]},{"t":"label","id":"answer-thanks"},{"t":"say","char":"CHR-HITORI","expr":"smirk","text":"……礼を言われるような話じゃないけどな。"},{"t":"goto","label":"other-world"},{"t":"label","id":"answer-now"},{"t":"say","char":"CHR-HITORI","expr":"normal","text":"今か。……今は、まあ。こうしてここにいる。"},{"t":"label","id":"other-world"},{"t":"say","char":"CHR-HITORI","expr":"serious","text":"そのあと、僕は別の世界で目を覚ました。そこで手に入れたのが、【自我】っていう力だ。"},{"t":"say","char":"CHR-HITORI","expr":"normal","text":"制御なんてできなかった。それでも、一緒に暮らしてくれた人がいて、たった一度だけ僕を負かした師匠がいて……力は少しずつ、形になりかけてた。"},{"t":"say","char":"CHR-HITORI","expr":"sad","text":"でも、その人がいなくなって。力が暴れて、僕はそれに呑まれた。……それで、二回目だ。"},{"t":"fx","type":"glitch","ms":600},{"t":"narr","text":"独の輪郭が、一瞬だけ大きくぶれた。紅葉が、握った手に力を込める。"},{"t":"say","char":"CHR-HARUKA","expr":"normal","text":"——そうして三回目に、あなたはこの街に落ちてきたのよね。"},{"t":"show","char":"CHR-HARUKA","pos":"center","expr":"smile"},{"t":"narr","text":"いつの間にか、ハルカが階段の上に立っていた。手には、湯気の立つカップが四つ。"},{"t":"say","char":"CHR-HARUKA","expr":"smile","text":"二人とも、おかえりなさい。{player}さんも。今夜は夜ふかしさんが多いわね。"},{"t":"say","char":"CHR-HITORI","expr":"normal","text":"……ハルカさん。"},{"t":"say","char":"CHR-HARUKA","expr":"normal","text":"初めて会った日の独くんは、自分の力に半分呑まれかけていたわ。【自我】は転生して {Glitch} として完成していたけれど、ひどく不安定だった。"},{"t":"say","char":"CHR-HARUKA","expr":"smile","text":"だから、拾ったの。力の安定化と、改良と。それから、働く場所と、温かいごはんと、帰ってくる家。"},{"t":"say","char":"CHR-HITORI","expr":"smirk","text":"……おかげで、こき使われてる。"},{"t":"say","char":"CHR-HARUKA","expr":"smile","text":"ふふ。そういうことにしておきましょうか。"},{"t":"say","char":"CHR-HARUKA","expr":"serious","text":"でもね、独くんは最近、自分で選んだの。呪いみたいにまとわりついていた {Glitch} から、自分の魂を解き放つことを。"},{"t":"say","char":"CHR-HITORI","expr":"normal","text":"……護るものが決まったから。目印があれば、もう迷わない。"},{"t":"narr","text":"独は、紅葉と揃いの指輪に、ほんの一瞬だけ目を落とした。"},{"t":"say","char":"CHR-MOMIJI","expr":"surprised","text":"……え？　今の、私のこと？　ねえ独くん、今のって——"},{"t":"say","char":"CHR-HITORI","expr":"annoyed","text":"言わない。"},{"t":"say","char":"CHR-MOMIJI","expr":"pout","text":"言ってよー！"},{"t":"say","char":"CHR-HARUKA","expr":"smile","text":"{player}さん。ここはね、「助けて」って言っていい場所なの。独くんにも、紅葉ちゃんにも。もちろん、あなたにも。"},{"t":"choice","id":"promise","options":[{"value":"me","text":"そのときは、ちゃんと言う","goto":"promise-me"},{"value":"them","text":"みんなが困ったときも、言ってほしい","goto":"promise-them"}]},{"t":"label","id":"promise-me"},{"t":"say","char":"CHR-HARUKA","expr":"smile","text":"ええ、約束よ。"},{"t":"goto","label":"ending"},{"t":"label","id":"promise-them"},{"t":"say","char":"CHR-MOMIJI","expr":"smile","text":"うん！　……ほら、独くんも。"},{"t":"say","char":"CHR-HITORI","expr":"smirk","text":"……善処する。"},{"t":"say","char":"CHR-MOMIJI","expr":"pout","text":"独くんの「善処する」は、だいたいしないやつ！"},{"t":"label","id":"ending"},{"t":"narr","text":"カップの湯気の向こうで、三人が笑っている。雨の音は、いつの間にか小さくなっていた。"},{"t":"set","flag":"story.interlude.mark.clear","value":true},{"t":"fx","type":"fade-out","ms":1000},{"t":"title","text":"INTERLUDE — 目印","sub":"ARCHIVE に、アカルアの三人の記録が追加された"},{"t":"end"}]}]`),ke=JSON.parse(`[{"id":"TERM-NETWORK","category":"term","title":"Network","unlock":[],"sections":[{"id":"1","title":"概要","text":"あらゆる存在が情報として記録される世界。人間、生物、概念、場所、物体、出来事……すべては Memory として保存されている。"}]},{"id":"TERM-MEMORY","category":"term","title":"Memory","unlock":[],"sections":[{"id":"1","title":"概要","text":"Network に記録された存在が、カード状のデータとして具現化したもの。Memory はそれぞれ固有のステータス・スキル・パッシブ能力・属性・戦闘スタイル、そして個別の記録を持つ。"}]},{"id":"TERM-SYNC","category":"term","title":"MEMORY SYNC","subtitle":"メモリー・シンク","unlock":[],"sections":[{"id":"1","title":"概要","text":"Memory に触れ、その記録に宿る存在の性質と能力を自分自身に反映する力。一度同期した Memory はいつでも同期先を変更できるが、戦闘中に変更することはできない。"},{"id":"2","title":"完全同期","text":"メインに同期した Memory が、戦闘時の能力・ステータス・姿を決定する。サブ Memory は補助スキルだけを貸してくれる。完全同期できるのは、常にひとつだけだ。"}]},{"id":"TERM-OUTFLOW","category":"term","title":"流出","unlock":[],"sections":[{"id":"1","title":"概要","text":"Network 各地から Memory が大量に流れ出した異常事態。Memory を失った世界では、情報の欠落や存在の消失、異常現象が起きている。"}]},{"id":"TERM-SIGNAL","category":"term","title":"流出反応","unlock":[{"type":"encounterCleared","encounterId":"ENC-001"}],"sections":[{"id":"1","title":"概要","text":"流出した Memory が周囲の記録を歪めて生まれる反応。値を失ったデータの残骸が集まり、近づく者を攻撃する。鎮静化すると、取り込まれていた Memory を検出できることがある。"}]},{"id":"TERM-REWRITE","category":"term","title":"REWRITE","subtitle":"リライト","unlock":[{"type":"encounterCleared","encounterId":"ENC-001"}],"sections":[{"id":"1","title":"概要","text":"Memory の情報を戦闘中に再構築する力。行動するたびに蓄積する REWRITE GAUGE が満ちたとき、メイン Memory 固有の効果を発動できる。"}]},{"id":"TERM-ENERGY","category":"term","title":"SYNC ENERGY","unlock":[],"sections":[{"id":"1","title":"概要","text":"Memory のスキルを使うための共通のエネルギー。自分の手番が来るたびに少しずつ回復し、防御態勢をとると多く回復する。"}]},{"id":"TERM-RESTORE","category":"term","title":"世界修復","unlock":[{"type":"storyCleared","chapterId":"CH-001"}],"sections":[{"id":"1","title":"概要","text":"回収した Memory が元の世界へ帰ることで、失われていたものが戻ってくること。人物の記録なら住人が帰り、場所なら建物やエリアが、出来事なら歴史が、物体なら機能が、生物なら生態系が、概念なら世界の特殊な働きが復元される。"}]},{"id":"TERM-AKARUA","category":"term","title":"何でも屋「アカルア」","unlock":[{"type":"storyCleared","chapterId":"CH-000"}],"related":{"characterId":"CHR-HARUKA"},"sections":[{"id":"1","title":"概要","text":"白石ハルカが店長を務める、NULL CITY の何でも屋。電子独と電子紅葉が所属し、{player} も身を寄せている。雨の街の中で、古い看板の灯りだけがいつも温かい。"},{"id":"2","title":"お仕事","text":"探し物から流出反応の鎮静化まで、頼まれれば何でも引き受ける。Memory の回収を始めてから、店の端末はひっきりなしに反応を拾うようになった。","unlock":[{"type":"storyCleared","chapterId":"CH-001"}]}]},{"id":"CHR-REC-HARUKA","category":"character","title":"白石ハルカ","subtitle":"何でも屋「アカルア」店長","unlock":[{"type":"storyCleared","chapterId":"CH-000"}],"related":{"characterId":"CHR-HARUKA"},"sections":[{"id":"1","title":"プロフィール","text":"何でも屋「アカルア」の店長。-No.2【神の娘】-。灰色の髪と紫の瞳を持つ、Network（神格世界）出身の女性。穏やかで、いつも誰かのために温かいものを用意している。"},{"id":"2","title":"力","text":"【全知全能】あらゆる知識のひとつを選び、その代わりとして用いることができる。\\n【未確認学】この世の森羅万象を生み出し、操ることができる。不可能を可能にする力。"},{"id":"3","title":"アカルアの店長として","text":"行き場を失っていた独を拾い、その能力の安定化と改良、働き場所と衣食住を与えた。独と紅葉にとっては、母親のような、優しいお姉さんのような存在。二人の揃いの指輪も、ハルカの手によるものだという。","unlock":[{"type":"storyCleared","chapterId":"CH-001"}]},{"id":"4","title":"拾った日","text":"Network に落ちてきたばかりの独は、完成したばかりの {Glitch} に半ば呑まれかけていた。ハルカは彼を拾い、力の安定化と改良を手伝い、働く場所と温かいごはんと、帰ってくる家を用意した。\\n「ここはね、『助けて』って言っていい場所なの。」——それが、アカルアのいちばん最初の約束だという。","unlock":[{"type":"storyCleared","chapterId":"INT-001"}]}]},{"id":"CHR-REC-HITORI","category":"character","title":"電子 独","subtitle":"【原点個体】 / 何でも屋「アカルア」","unlock":[{"type":"storyCleared","chapterId":"CH-000"}],"related":{"characterId":"CHR-HITORI"},"sections":[{"id":"1","title":"プロフィール","text":"17歳。現世（日本）から来た少年。《神の失敗作》と呼ばれた、歴戦の《敗北者》。口は悪いが、仕事は誰より早い。一人称は「僕」。"},{"id":"2","title":"力","text":"【{Glitch}】かつて【自我】と呼ばれた力が、転生を経て完成したもの。ゲームのバグを具現化したような力。テレポートや攻撃の無力化など、汎用性の高い圧倒的な力を持つが、自身の身体を犠牲にする諸刃の剣でもある。\\n【{upset}】大番狂わせ。自分よりも上の存在にのみ使え、自身と相手を対等な立場に置く。"},{"id":"3","title":"アカルアでの日々","text":"転生を経て完成した {Glitch} は、まだ不安定だった。白石ハルカに拾われ、能力の安定化と改良、そして居場所を与えられた。今はハルカのもとで、紅葉と一緒に暮らしている。——良くも悪くも、愛されている。\\n「……僕は……まだ終わったつもりじゃ無いぞ……。」","unlock":[{"type":"storyCleared","chapterId":"CH-001"}]},{"id":"4","title":"【現世】","contentNote":"自死・いじめに関する記述があります。","text":"現実世界（日本）で、ごく普通に暮らしていた高校生。後輩の孤月紅葉——今の電子紅葉——から一方的に想いを寄せられていたが、本人はそれに気づいていなかった。\\nある日、両親を事故で亡くし、心の均衡を失う。その不調につけ込むように、クラスメイトからのいじめが始まった。\\n彼は誰にも助けを求めなかった。紅葉にも。自分がいなくなれば、紅葉が巻き込まれることもなく、自分も楽になれる——そう思い込み、彼女の目の前で、自ら命を絶った。\\n「あの時、僕は誰にも『助けて』って言わなかった。……いちばん傷ついたのは、目の前にいたあいつだった。」","unlock":[{"type":"storyCleared","chapterId":"INT-001"}]},{"id":"5","title":"【もうひとつの世界】","contentNote":"自死に関する記述があります。","text":"魂は冥界へ渡り、紆余曲折の末に肉体を取り戻した。そこで目覚めたのが、現世での性格や行動を誇張したような能力【自我】——制御できない、未完成の力だった。\\nその世界で、彼はある人とひとつ屋根の下で暮らしていた。たった一度だけ敗れた相手のことは、師匠と呼んでいた。\\nだがある日、その同居人が姿を消す。自分に愛情を注いでくれていた存在を失い、完成に近づいていた【自我】は不安定になった。彼は自らの力に呑まれ、ふたたびその命を終えた。","unlock":[{"type":"storyCleared","chapterId":"INT-001"}]},{"id":"6","title":"【Network】","text":"転生の果てに、【自我】は {Glitch} として完成した。それでもまだ不安定だった彼を拾ったのが、白石ハルカだった。能力の安定化と改良、働く場所と衣食住——そして、帰ってくる家。\\n最近、彼は呪いのようにまとわりついていた {Glitch} から、自分の魂を解き放った。護るべき「目印」が決まった彼は、新たな能力を、自分の意思で生み出した。\\n今はハルカのもとで、電子紅葉と一緒に、幸せに（？）暮らしている。","unlock":[{"type":"storyCleared","chapterId":"INT-001"}]}]},{"id":"CHR-REC-MOMIJI","category":"character","title":"電子 紅葉","subtitle":"【原点個体】 / 何でも屋「アカルア」","unlock":[{"type":"storyCleared","chapterId":"CH-000"}],"related":{"characterId":"CHR-MOMIJI"},"sections":[{"id":"1","title":"プロフィール","text":"16歳。いつも独のそばにいる少女。現世では独の後輩だった。応急手当と観察眼に優れ、アカルアの仕事を支えている。"},{"id":"2","title":"力","text":"【{heartache}】ダメージや効果を受けたとき、代わりに自分の心をすり減らすことができる。\\n【{CHAOS LOVE}】独に向けられた効果やダメージ、技能を強制的に引き受ける。この力には、いかなる判定も効果も及ばない。"},{"id":"3","title":"揃いの指輪","text":"独とお揃いの、ハルカ製のダイヤモンドの指輪。壊れることも、外れることも、消えることもない。刻まれた言葉は——「今までの旅路は無駄なんかじゃない」。","unlock":[{"type":"storyCleared","chapterId":"CH-001"}]},{"id":"4","title":"【現世】","contentNote":"自死に関する記述があります。","text":"現世での名前は孤月紅葉。独のひとつ下の後輩で、ずっと彼に想いを寄せていた。——一方的に。\\n彼が両親を失い、少しずつ壊れていくのを、彼女は見ていた。けれど彼は、最後まで彼女に助けを求めなかった。あの日、彼が目の前からいなくなったことを、彼女は今も覚えている。\\n今は「電子」の名を名乗り、揃いの指輪をはめて、独のすぐそばにいる。もう二度と、彼がひとりで抱え込まないように。","unlock":[{"type":"storyCleared","chapterId":"INT-001"}]}]},{"id":"EVT-OUTFLOW","category":"event","title":"大流出","subtitle":"Network が記録を失った日","unlock":[{"type":"discoveredMemory","memoryId":"MEM-0011"}],"related":{"memoryIds":["MEM-0011"]},"sections":[{"id":"1","title":"概要","text":"ある日、Network の各地で記録が一斉にカード状に固まり、世界の外へと流れ出した。流出した Memory の総数は、今も集計が終わっていない。"},{"id":"2","title":"欠けている記録","text":"大流出の記録には、発生時刻も被害範囲も記されている。欠けているのは「原因」と、最初に流出した Memory の名前だけだ。","unlock":[{"type":"storyCleared","chapterId":"CH-001"}]}]},{"id":"EVT-FIRSTCONNECT","category":"event","title":"最初の接続","unlock":[{"type":"ownedMemory","memoryId":"MEM-0006"}],"related":{"memoryIds":["MEM-0006"]},"sections":[{"id":"1","title":"概要","text":"{player} が初めて Network に接続した瞬間。その記録のタイムスタンプは、大流出が起きた時刻よりも前を指している。"},{"id":"2","title":"雨の路地で","text":"目を覚ました {player} を見つけたのは、何でも屋「アカルア」の独と紅葉だった。","unlock":[{"type":"storyCleared","chapterId":"CH-000"}]}]},{"id":"EVT-RELIGHT","category":"event","title":"第七区画の再点灯","unlock":[{"type":"encounterCleared","encounterId":"ENC-002"}],"related":{"worldId":"WORLD-001"},"sections":[{"id":"1","title":"概要","text":"消灯の影を鎮めた夜、NULL CITY 第七区画の街灯がひとつ、またひとつと灯り始めた。雨はまだ、止んでいない。"}]},{"id":"FRAG-001","category":"fragment","title":"FRAGMENT LOG #001","subtitle":"第七区画の流出反応","unlock":[{"type":"encounterCleared","encounterId":"ENC-001"}],"sections":[{"id":"1","title":"ログ","text":"> 残骸の中に、ひとつだけ傷のない記録があった。『雨が止んだら、迎えに行く』。差出人の欄は、雨で滲んで読めない。"}]},{"id":"FRAG-002","category":"fragment","title":"FRAGMENT LOG #002","subtitle":"消えかけの街灯","unlock":[{"type":"encounterCleared","encounterId":"ENC-002"}],"sections":[{"id":"1","title":"ログ","text":"> 消灯の影は、最後に一度だけ街灯を見上げた。忘れられることを、誰よりも怖がっていたのは、影のほうだったのかもしれない。"}]},{"id":"FRAG-003","category":"fragment","title":"FRAGMENT LOG #003","subtitle":"誤植の閲覧室","unlock":[{"type":"encounterCleared","encounterId":"ENC-003"}],"sections":[{"id":"1","title":"ログ","text":"> 頁の端に、几帳面な文字で書き込みがあった。『この棚の分類番号は、誰かが意図して書き換えている』。"}]},{"id":"FRAG-004","category":"fragment","title":"FRAGMENT LOG #004","subtitle":"封印書架の番人","unlock":[{"type":"encounterCleared","encounterId":"ENC-004"}],"sections":[{"id":"1","title":"ログ","text":"> 番人の記録には、最後の命令が残っていた。『この扉を、決して開けさせるな。たとえ、司書であっても』。"}]},{"id":"FRAG-005","category":"fragment","title":"FRAGMENT LOG #005","subtitle":"枯れ蔓の小径","unlock":[{"type":"encounterCleared","encounterId":"ENC-005"}],"sections":[{"id":"1","title":"ログ","text":"> 枯れた蔓の先に、一輪だけ色の残った花があった。花の記録は、誰かの名前を呼び続けていた。"}]},{"id":"FRAG-006","category":"fragment","title":"FRAGMENT LOG #006","subtitle":"色喰い","unlock":[{"type":"encounterCleared","encounterId":"ENC-006"}],"sections":[{"id":"1","title":"ログ","text":"> 色喰いの中から、たくさんの色が溢れ出した。そのどれもが、誰かに覚えていてほしかった色だった。"}]},{"id":"FRAG-007","category":"fragment","title":"FRAGMENT LOG #007","subtitle":"破損体の群れ","unlock":[{"type":"encounterCleared","encounterId":"ENC-007"}],"sections":[{"id":"1","title":"ログ","text":"> 破損体は、ひとつひとつが小さな記録の寄せ集めだった。家族写真、買い物のメモ、言いそびれた『ごめん』。"}]},{"id":"FRAG-008","category":"fragment","title":"FRAGMENT LOG #008","subtitle":"ハウンド・アルファ","unlock":[{"type":"encounterCleared","encounterId":"ENC-008"}],"sections":[{"id":"1","title":"ログ","text":"> 猟犬の長は、倒れる直前に命令を問い直した。『破損を除去せよ。……我々は、まだ、破損ではないか？』"}]}]`),Ae=[`HUMAN`,`CREATURE`,`CONCEPT`,`OBJECT`,`LOCATION`,`EVENT`,`UNKNOWN`],je=[`COMMON`,`UNCOMMON`,`RARE`,`EPIC`,`LEGEND`,`IRREGULAR`],Me=[`DATA`,`VOID`,`ERROR`,`LIFE`,`CHAOS`,`ORDER`],Ne=[`hp`,`atk`,`def`,`spd`,`tec`,`res`],Pe=[`starter`,`explore`,`quest`,`boss`,`story`,`event`,`shop`,`fusion`,`unknown`],Fe=[`DATA`,`FRAGMENT`,`CORE`,`CREDIT`],Ie=[`NEW_GAME`,`DEV_GRANT`,`MEMORY_LEVEL_UP`,`SKILL_UPGRADE`,`LIMIT_BREAK`,`FUSION`,`SHOP_PURCHASE`,`QUEST_REWARD`,`BATTLE_REWARD`,`STORY_REWARD`,`DUPLICATE_MEM
